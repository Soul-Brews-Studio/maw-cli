name: CI

on:
  push:
    branches: [alpha]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        language: [go, rs, js, zig]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - if: matrix.language == 'rs'
        run: rustup toolchain install 1.69.0 --profile minimal
      - if: matrix.language == 'js'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - if: matrix.language == 'zig'
        run: python3 scripts/install-zig-ci.py
      - name: Compile and smoke (no unit tests or artifact uploads)
        env:
          MAW_LANGUAGE: ${{ matrix.language }}
        run: |
          case "$MAW_LANGUAGE" in
            go)
              go version
              /usr/bin/time -p go -C go build -o ../bin/maw-go ./cmd/maw
              sh scripts/smoke.sh "$PWD/bin/maw-go"
              go -C go vet ./...
              python3 scripts/mcp-smoke.py "$PWD/bin/maw-go"
              python3 scripts/index-smoke.py -- "$PWD/bin/maw-go"
              ;;
            rs)
              rustup run 1.69.0 rustc --version
              /usr/bin/time -p rustup run 1.69.0 cargo build --locked --release --manifest-path rs/Cargo.toml
              sh scripts/smoke.sh "$PWD/rs/target/release/maw-rs"
              python3 scripts/index-smoke.py -- "$PWD/rs/target/release/maw-rs"
              ;;
            js)
              bun --version
              /usr/bin/time -p bun build js/src/cli.ts --target=bun --outdir js/dist
              sh scripts/smoke.sh "$(command -v bun)" "$PWD/js/dist/cli.js"
              python3 scripts/index-smoke.py -- "$(command -v bun)" "$PWD/js/dist/cli.js"
              ;;
            zig)
              zig version
              (cd zig && /usr/bin/time -p zig build -Doptimize=ReleaseFast)
              sh scripts/smoke.sh "$PWD/zig/zig-out/bin/maw-zig"
              python3 scripts/index-smoke.py -- "$PWD/zig/zig-out/bin/maw-zig"
              ;;
          esac
