name: CI

# Scheduled, not per push or PR (#49): hourly while alpha changes, a daily
# heartbeat otherwise. The gate job decides; workflow_dispatch always runs.
# Pull requests are checked locally with `just <port> check` before merge.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-alpha
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 utils/scripts/ci-gate.py

  smoke:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        language: [go, rs, js, zig]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - if: matrix.language == 'rs'
        run: rustup toolchain install 1.69.0 --profile minimal
      - if: matrix.language == 'js'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - if: matrix.language == 'zig'
        run: python3 utils/scripts/install-zig-ci.py
      - name: Compile and smoke (no unit tests or artifact uploads)
        env:
          MAW_LANGUAGE: ${{ matrix.language }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
        run: |
          case "$MAW_LANGUAGE" in
            go)
              python3 -m py_compile utils/scripts/release.py utils/scripts/build-release.py utils/scripts/package-smoke.py
              go version
              /usr/bin/time -p go -C src/go build -o ../../bin/maw-go ./cmd/maw-go
              sh utils/scripts/smoke.sh "$PWD/bin/maw-go"
              python3 utils/scripts/marketplace-smoke.py "$PWD/bin/maw-go"
              python3 utils/scripts/selector-smoke.py "$PWD/bin/maw-go"
              python3 utils/scripts/archive-smoke.py "$PWD/bin/maw-go"
              python3 utils/scripts/update-smoke.py
              go -C src/go vet ./...
              python3 utils/scripts/mcp-smoke.py "$PWD/bin/maw-go"
              ;;
            rs)
              rustup run 1.69.0 rustc --version
              /usr/bin/time -p rustup run 1.69.0 cargo build --locked --release --manifest-path src/rs/Cargo.toml
              sh utils/scripts/smoke.sh "$PWD/src/rs/target/release/maw-rs"
              ;;
            js)
              bun --version
              python3 utils/scripts/package-smoke.py
              /usr/bin/time -p bun build src/js/src/cli.ts --target=bun --outdir src/js/dist
              sh utils/scripts/smoke.sh "$(command -v bun)" "$PWD/src/js/dist/cli.js"
              ;;
            zig)
              zig version
              (cd src/zig && /usr/bin/time -p zig build -Doptimize=ReleaseFast)
              sh utils/scripts/smoke.sh "$PWD/src/zig/zig-out/bin/maw-zig"
              ;;
          esac
