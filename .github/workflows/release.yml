name: Alpha prebuilt release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [alpha]

permissions:
  contents: read

# A retry of one source CI run resumes its own release, never another commit's.
concurrency:
  group: alpha-prebuilt-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Soul-Brews-Studio/maw-cli' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'alpha' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Plan immutable CalVer release for the verified source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 utils/scripts/release.py prepare --ci-run "$CI_RUN_ID" --output release-plan.json
          python3 - <<'PYTHON'
          import json, os
          plan = json.load(open('release-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('skip', 'tag', 'commit'):
                  value = str(plan.get(key, '')).lower() if key == 'skip' else plan.get(key, '')
                  print(f'{key}={value}', file=output)
          PYTHON
      - if: steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [go, rs, js, zig]
        platform:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - if: matrix.language == 'rs'
        run: rustup toolchain install 1.69.0 --profile minimal --no-self-update && rustup default 1.69.0
      - if: matrix.language == 'js'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - if: matrix.language == 'zig'
        run: python3 utils/scripts/install-zig-ci.py
      - name: Build native executable, smoke it, and archive only public outputs
        env:
          LANGUAGE: ${{ matrix.language }}
          TARGET_OS: ${{ matrix.platform.os }}
          TARGET_ARCH: ${{ matrix.platform.arch }}
          VERSION: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
        run: |
          python3 utils/scripts/build-release.py --language "$LANGUAGE" --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$VERSION" --commit "$SOURCE_SHA" --output release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-${{ matrix.language }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: release-assets/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: release-input
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilt-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Verify complete assets, then publish a public alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 utils/scripts/release.py publish --plan release-input/release-plan.json --assets release-assets
